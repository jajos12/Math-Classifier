[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-classifier-laya-experiment"
version = "0.1.0"
description = "Standalone GNN and Laya tactic-ranking experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "huggingface_hub",
  "matplotlib",
  "tqdm",
]

[tool.setuptools]
py-modules = [
  "comparison", "config", "data", "evaluation", "fusion", "fuse_eval", "gnn",
  "gnn_bundle", "graph", "laya_interface", "laya_adapter", "laya_retrain",
  "pipeline", "progress", "retraining", "laya_trainer", "tactic_choose",
]
